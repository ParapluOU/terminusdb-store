[package]
name = "terminus-store"
version = "0.22.0"
authors = ["Matthijs van Otterdijk <matthijs@datachemist.com>", "Philippe Höij <philippe.hoij@dfrnt.com>"]
edition = "2018"
license = "Apache-2.0"
description = "a triple store library"
homepage = "https://terminusdb.com"
repository = "https://github.com/terminusdb/terminusdb-store"
documentation = "https://docs.rs/terminus-store/"
exclude = [".gitignore", ".github/", "/ci/"]

[dependencies]
byteorder = "1.4"
futures = "0.3"
futures-locks = "0.7"
tokio = {version = "1.0", features = ["full"]}
tokio-util = {version = "0.6", features = ["codec"]}
bytes = "1.0"
rand = "0.8"
lazy_static = "1.4"
fs2 = "0.4.3"
tar = "0.4"
flate2 = "1.0"
rayon = "1.7"
thiserror = "1.0"
async-trait = "0.1"
itertools = "0.10"
rug = {version="1.16", default-features=false, features=["integer","rational"]}
num-derive = "0.4"
num-traits = "0.2"
chrono = "0.4"
base64 = "0.13"
hex = "0.4"
regex = "1.5"
lru = "0.10"
bitvec = "1.0"
tempfile = "3.1"
tdb-succinct = "0.1.2"
sha2 = "0.10"
libc = "0.2"

# Proof-of-WOQL crypto stack (Phase 1a: validate the dependency stack builds and
# Dory works end-to-end). `arkworks` feature = pure-CPU arkworks BN254 backend
# only; NO disk-persistence/GPU/blitzar. dory-pcs 0.4.0 pins the arkworks 0.5.x
# stack, so the direct ark-* deps below track 0.5 to stay on one source identity.
dory-pcs = { version = "0.4.0", default-features = false, features = ["arkworks"] }
ark-bn254 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-poly = "0.5"
ark-serialize = "0.5"

[features]
noreadlock = []
eprint_log = []
rollup_metadata_experimental = []

[workspace]

# Keep standalone Store builds on the exact succinct implementation used by
# TerminusDB.  The dependency itself remains a crates.io dependency so a
# TerminusDB workspace patch produces one Cargo source identity, rather than a
# second incompatible copy reached through a direct git dependency.
[patch.crates-io]
tdb-succinct = { git = "https://github.com/terminusdb-org/tdb-succinct", rev = "ec1519923e44e73cad17264f21534065855be6e0" }
