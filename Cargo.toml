[package]
name = "terminus-store"
# Tracks the upstream release this fork is merged up to, so a TerminusDB
# [patch.crates-io] accepts it as a semver-compatible replacement for the
# upstream version its consumers ask for (12.1.0-rc3 asks for 0.23.x). The
# fork's own additions are the proof APIs; the base Store API is upstream's.
version = "0.23.1"
authors = ["Matthijs van Otterdijk <matthijs@datachemist.com>", "Philippe Höij <philippe.hoij@dfrnt.com>"]
edition = "2018"
license = "Apache-2.0"
description = "a triple store library"
homepage = "https://terminusdb.com"
repository = "https://github.com/terminusdb/terminusdb-store"
documentation = "https://docs.rs/terminus-store/"
exclude = [".gitignore", ".github/", "/ci/"]

[dependencies]
byteorder = "1.4"
futures = "0.3"
futures-locks = "0.7"
tokio = {version = "1.0", features = ["full"]}
tokio-util = {version = "0.6", features = ["codec"]}
bytes = "1.0"
rand = "0.8"
lazy_static = "1.4"
fs2 = "0.4.3"
tar = "0.4"
flate2 = "1.0"
rayon = "1.7"
thiserror = "1.0"
async-trait = "0.1"
itertools = "0.10"
rug = {version="1.16", default-features=false, features=["integer","rational"]}
num-derive = "0.4"
num-traits = "0.2"
chrono = "0.4"
base64 = "0.13"
hex = "0.4"
regex = "1.5"
lru = "0.10"
bitvec = "1.0"
tempfile = "3.1"
# The same direct git dependency upstream 0.23.1 declares, spec-identical on
# purpose: a consumer that patches crates-io tdb-succinct to this very tag then
# resolves ONE package, rather than a second copy whose types do not unify.
tdb-succinct = {git="https://github.com/terminusdb-org/tdb-succinct", tag="v0.2.1"}
libc = "0.2"

# Proof-of-WOQL crypto stack. The ParapluOU Dory fork adds caller-owned prover
# backend plumbing while retaining the stock Arkworks CPU implementation and
# public proof format. No GPU runtime is selected or initialized here.
# A git dependency, not a sibling path: this repository has to build on its own
# (and as a git dependency of another), which a `../dory` path outside it cannot
# do. A workspace that holds both checked out patches it back to the local copy
# (see Parture's root manifest).
#
# Optional, and reached only through the `proof` feature: this whole stack is
# some 50 crates of generic-heavy field and curve arithmetic, and a consumer
# that only reads and writes triples should not compile it. See [features].
dory-pcs = { version = "0.4.2", git = "https://github.com/ParapluOU/dory", branch = "main", default-features = false, features = ["arkworks"], optional = true }
ark-bn254 = { version = "0.5", optional = true }
ark-ec = { version = "0.5", optional = true }
ark-ff = { version = "0.5", optional = true }
ark-poly = { version = "0.5", optional = true }
ark-serialize = { version = "0.5", optional = true }
# Explicitly reproducible/portable CsPRNG used to derive the global transparent
# Dory setup deterministically (same seed => identical public parameters on
# every node). ChaCha20Rng's stream is documented stable across releases.
rand_chacha = { version = "0.3", optional = true }
# Blake2b hash-to-field for dictionary-binding (same fn on prover and verifier).
blake2 = { version = "0.10", optional = true }
# Domain-separated digests throughout the commitment scheme.
sha2 = { version = "0.10", optional = true }

[target.'cfg(not(unix))'.dependencies]
atomicwrites = "0.4"

[features]
# Deliberately empty: `proof` is opt-in. The crate's whole reason to be a fork
# is the proving stack, but a consumer reached transitively (TerminusDB's
# store-prolog, the grpc label-store client, anything that only reads and
# writes triples) must not pay 50 crates of curve arithmetic for a feature it
# never calls — and a transitive consumer cannot pass `default-features =
# false` on someone else's dependency declaration, so opting *out* is not
# something a downstream crate can do. Opting in is.
#
# The store's own test suite is mostly the proof system: develop and test it
# with `cargo test --features proof`.
default = []
noreadlock = []
eprint_log = []
rollup_metadata_experimental = []
# Proof-of-WOQL: the per-layer commitment sidecar and the query-proof gadgets
# over it, plus the Dory/Arkworks stack they are built on.
#
# On (the default) this crate is what it has been: a commit can carry proof
# state, `ProofStateMode::On` is selectable, and `proof::*` is the full gadget
# tree. Off, the storage API keeps its shape — `proof_layer`,
# `write_proof_layer`, `migrate_proof_chain`, `import_layers_with_expected_roots`
# are all still there — but every operation that would produce or read a
# commitment fails with `Unsupported` and a sentence saying this build has the
# feature off, and `TERMINUSDB_PROOF_STATE=true` is a startup panic rather than
# a silent "not proving". A store that never proves is byte-identical either
# way: the sidecar is a separate file, so a layer written by a proof-off build
# is exactly a layer an unforked terminus-store would have written.
#
# The scheme-independent part of `proof` — the canonical datatype/object/triple
# model, `ProofRecord`, the file framing and its limits — is always compiled,
# because the storage plumbing names those types in signatures it keeps either
# way.
proof = ["dep:dory-pcs", "dep:ark-bn254", "dep:ark-ec", "dep:ark-ff", "dep:ark-poly", "dep:ark-serialize", "dep:rand_chacha", "dep:blake2", "dep:sha2"]
blitzar-cpu = ["proof", "dory-pcs/blitzar-cpu"]
blitzar-gpu = ["proof", "dory-pcs/blitzar-gpu"]

[workspace]

# Keep standalone Store builds on the exact succinct implementation used by
# TerminusDB.  The dependency itself remains a crates.io dependency so a
# TerminusDB workspace patch produces one Cargo source identity, rather than a
# second incompatible copy reached through a direct git dependency.
#
# v0.2.1 is what TerminusDB 12.1.0-rc3 pins (it supersedes the 0.1.x
# xbrl-json-iso-intervals rev this used to follow). Every consumer that builds
# this crate must patch the same tag: the 0.2 line is not on crates.io, so a
# bare `tdb-succinct = "0.2"` requirement resolves nowhere without it.
[patch.crates-io]
tdb-succinct = { git = "https://github.com/terminusdb-org/tdb-succinct", tag = "v0.2.1" }

# Targets that are about the commitment scheme itself, so a build without the
# `proof` feature skips them rather than failing to compile.
[[example]]
name = "proof_store_bench"
required-features = ["proof"]

[[example]]
name = "proving_cost"
required-features = ["proof"]

[[test]]
name = "commitment_root_fixture"
required-features = ["proof"]
